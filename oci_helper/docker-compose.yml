# =============================================================================
# OCI Helper - Docker Compose 配置
#
# 使用方式：
#   docker compose up -d
#
# 配置说明：
#   - 端口映射：宿主机 127.0.0.1:8888 -> 容器 8888
#   - 数据持久化：./data（数据库）、./keys（OCI 密钥）、./logs（日志）
#   - 环境变量：通过 .env 文件或 environment 块配置
# =============================================================================

services:
  oci-helper:
    image: ghcr.io/smallmx/ocihelper:${OCI_HELPER_IMAGE_TAG:-latest}
    container_name: oci-helper
    restart: unless-stopped
    ports:
      # 默认只允许宿主机本地访问；需要局域网监听时显式设置 OCI_HELPER_BIND_ADDRESS。
      - "${OCI_HELPER_BIND_ADDRESS:-127.0.0.1}:${OCI_HELPER_SERVER_PORT:-8888}:8888"
    volumes:
      - oci-helper-data:/app/data
      - oci-helper-keys:/app/keys
      - oci-helper-logs:/app/logs
    environment:
      # ---- 必填项 ----
      # Web 管理面板登录账号
      - OCI_HELPER_WEB_ACCOUNT=${OCI_HELPER_WEB_ACCOUNT:-admin}
      # Web 管理面板登录密码
      - OCI_HELPER_WEB_PASSWORD=${OCI_HELPER_WEB_PASSWORD:?set OCI_HELPER_WEB_PASSWORD in .env}
      # ---- 可选项 ----
      # 服务监听端口
      - OCI_HELPER_SERVER_PORT=8888
      # JWT 密钥（留空则自动生成）
      - OCI_HELPER_JWT_SECRET=${OCI_HELPER_JWT_SECRET:-}
      # 持久化凭据加密密钥（留空则在数据卷中自动生成）
      - OCI_HELPER_DATA_ENCRYPTION_KEY=${OCI_HELPER_DATA_ENCRYPTION_KEY:-}
      - OCI_HELPER_JWT_EXPIRE_HOURS=${OCI_HELPER_JWT_EXPIRE_HOURS:-24}
      - OCI_HELPER_IP_BAN_THRESHOLD=${OCI_HELPER_IP_BAN_THRESHOLD:-5}
      - OCI_HELPER_IP_BAN_MINUTES=${OCI_HELPER_IP_BAN_MINUTES:-30}
      - OCI_HELPER_TRUST_PROXY_HEADERS=${OCI_HELPER_TRUST_PROXY_HEADERS:-false}
      - OCI_HELPER_CORS_ORIGINS=${OCI_HELPER_CORS_ORIGINS:-}
      - OCI_HELPER_TASK_WORKER_COUNT=${OCI_HELPER_TASK_WORKER_COUNT:-8}
      - OCI_HELPER_CREATE_TASK_MAX_ATTEMPTS=${OCI_HELPER_CREATE_TASK_MAX_ATTEMPTS:-1000}
      - OCI_HELPER_CHANGE_IP_INTERVAL_SECONDS=${OCI_HELPER_CHANGE_IP_INTERVAL_SECONDS:-10}
      - OCI_HELPER_CHANGE_IP_MAX_ATTEMPTS=${OCI_HELPER_CHANGE_IP_MAX_ATTEMPTS:-120}
      - OCI_HELPER_OCI_REQUEST_TIMEOUT_SECONDS=${OCI_HELPER_OCI_REQUEST_TIMEOUT_SECONDS:-120}
      - OCI_HELPER_LOG_LEVEL=${OCI_HELPER_LOG_LEVEL:-INFO}
      - OCI_HELPER_LOG_FILE_PATH=/app/logs/oci-helper.log
      # 数据库文件路径
      - OCI_HELPER_DB_PATH=/app/data/oci-helper.db
      # 密钥存储目录
      - OCI_HELPER_KEY_DIR_PATH=/app/keys
      # 时区
      - TZ=Asia/Shanghai
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; r = httpx.get('http://localhost:8888/api/health'); exit(0 if r.status_code==200 else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

volumes:
  oci-helper-data:
  oci-helper-keys:
  oci-helper-logs:
